onboarding = false

[theme]
name = "terminal"
auto_switch = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "off"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[keys]
prefix = "alt+b"
focus_agent = "prefix+shift+1..9"
split_vertical = ["prefix+/"]
split_horizontal = ["prefix+\\"]


